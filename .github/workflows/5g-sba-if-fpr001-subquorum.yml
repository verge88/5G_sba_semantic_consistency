name: 5g-sba-if-fpr001-subquorum

on:
  push:
    branches:
      - experiment/sba-if-fpr001-subquorum-20261009
    paths:
      - ".github/workflows/5g-sba-if-fpr001-subquorum.yml"
      - "5g/run_semantic_if_fpr001.py"
      - "tests/test_sba_semantic_if_fpr001.py"
      - "experiments/5g_sba_if_fpr001/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-fpr001-holdout:
    name: Isolation Forest FPR 0.1% / source suppression / operational stress
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen-range scientific dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2"
      - name: Check provenance, intervention, and calibration invariants
        run: |
          python -m unittest discover -s tests -p "test_sba_semantic_if_fpr001.py" -v
          python -m unittest discover -s tests -p "test_sba_semantic_if_two_channel.py" -v
          python -m unittest discover -s tests -p "test_sba_semantic_v9_provenance.py" -v
      - name: Frozen five-world FPR 0.1% nominal holdout
        run: |
          set -o pipefail
          python -u 5g/run_semantic_if_fpr001.py \
            --seeds 301 302 303 304 305 \
            --train 300 \
            --rank-calib 2500 \
            --joint-calib 2500 \
            --eval 2500 \
            --operational 250 \
            --attacks 250 \
            --target-fpr 0.001 \
            --out-dir runs/sba_if_fpr001_subquorum/301_305 \
            2>&1 | tee fpr001_experiment.log
      - name: Upload locked protocol results and full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sba-if-fpr001-subquorum-301-305
          path: |
            runs/sba_if_fpr001_subquorum/301_305/
            fpr001_experiment.log
          if-no-files-found: warn
          retention-days: 30
